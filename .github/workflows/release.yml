name: release

# Push a `v*` tag and this builds a static x86-64 binary, proves it loads its
# own eBPF on a real kernel, and leaves a draft release with the tarball and
# checksum attached. Reviewing and publishing that draft is the only manual
# step, and it comes last: if any step here fails, no release exists at all.
#
# The build deliberately runs before the release is created, which is the one
# place this differs from ripgrep - it creates the release first because it has
# many build jobs uploading into it, and this has one.
#
# x86-64 only, deliberately: aarch64 compiles and CI keeps checking that it
# does, but the programs have never been loaded on an ARM kernel, so that binary
# would be the project's first untested claim. An ARM kernel joins vm-matrix.yml
# first, then the binary follows (README: Requirements, Roadmap).
#
# Static musl, not glibc: the binary loads eBPF on kernels 5.15 through 6.18, so
# it has no business also demanding a recent glibc from the distro it lands on.
# musl targets link self-contained - rust-lld plus a bundled libc.a - so no
# musl-gcc is needed here, and nothing in truetop wants NSS: uids are mapped by
# parsing /etc/passwd directly (truetop/src/metrics/identity.rs), which is what
# makes a fully static build honest rather than quietly broken.
#
# workflow_dispatch builds and packages without creating anything, so the whole
# path can be exercised without spending a tag to find out it was broken.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl
  # Bump together with the toolchain in truetop-ebpf/Cargo.toml.
  BPF_LINKER_VERSION: "0.11.0"

permissions: {}

jobs:
  binary:
    runs-on: ubuntu-latest
    permissions:
      # Creating the draft release, at the end.
      contents: write
      # Signing the tarball's provenance, and recording it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/ebpf-toolchain

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      # No rust-cache: a published artifact is worth a cold build rather than
      # whatever a cache key shared with ci.yml happened to hold.
      - uses: taiki-e/install-action@v2
        with:
          tool: bpf-linker@${{ env.BPF_LINKER_VERSION }}

      - name: Name the artifact
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' truetop/Cargo.toml | cut -d'"' -f2)
          # A tag that disagrees with the manifest ships a binary reporting a
          # version that matches no release. Fail before anything is built.
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} != truetop/Cargo.toml v${version}" >&2
            exit 1
          fi
          echo "NAME=truetop-${version}-${TARGET}" >> "$GITHUB_ENV"

      - run: cargo build -p truetop --release --locked --target "${TARGET}"

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p "dist/${NAME}"
          install -m 0755 "target/${TARGET}/release/truetop" "dist/${NAME}/truetop"
          # Stripped after linking rather than through the release profile: that
          # profile is inherited by the nested cargo that builds truetop-ebpf,
          # where the debug info is the BTF the object carries. This rewrites the
          # outer ELF only - the eBPF object rides in .rodata untouched, which
          # the next step proves by loading it.
          strip "dist/${NAME}/truetop"
          install -m 0644 README.md LICENSE-MIT LICENSE-APACHE LICENSE-GPL2 "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && sha256sum "${NAME}.tar.gz" | tee SHA256SUMS)

      # The runner is a real kernel with BTF and passwordless sudo - ci.yml
      # already loads the programs here - so the artifact loads its own eBPF
      # before anyone can download it. Two ticks is enough to attach, collect and
      # exit, and it is the only check that the strip above left the object intact.
      - name: Load the packaged binary
        run: sudo "dist/${NAME}/truetop" --bench 2

      # The checksum proves the tarball arrived intact; it cannot prove where it
      # came from, since whoever could replace the file could replace the sums
      # beside it. This records, in a public log, that this exact tarball was
      # built by this workflow at this commit - `gh attestation verify
      # truetop-*.tar.gz --repo ramos-99/truetop` checks it against that log.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/${{ env.NAME }}.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: dist/*.tar.gz
          if-no-files-found: error

      # Draft, and created only once the binary above has run: a failed build
      # leaves no release behind at all, and the one that does appear already
      # has its files on it. A tag carrying a suffix (v0.1.0-rc1) is marked a
      # prerelease, which keeps it out of `latest`.
      - name: Draft the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          Static x86-64 binary, no runtime dependencies: it needs nothing from the
          distribution it lands on, only Linux 5.15 or newer with
          `CONFIG_DEBUG_INFO_BTF=y`, and `CAP_BPF`/`CAP_PERFMON` or root.

          ```sh
          tar xzf truetop-*-x86_64-unknown-linux-musl.tar.gz
          sha256sum -c SHA256SUMS
          sudo ./truetop
          sudo setcap cap_bpf,cap_perfmon+ep ./truetop   # then run it unprivileged
          ```
          EOF
          flags=()
          case "${GITHUB_REF_NAME}" in *-*) flags+=(--prerelease) ;; esac
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --generate-notes \
            "${flags[@]}" \
            "dist/${NAME}.tar.gz" dist/SHA256SUMS
