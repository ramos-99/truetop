name: vm-matrix

# Live-kernel integration tests across kernel versions, in a VM. Heavier and
# newer than the single-kernel run in ci.yml, so it stays dispatch/scheduled and
# is not wired into the required `check` gate until it has proven stable across a
# few green runs.
#
# We drive the vmtest CLI directly rather than danobi/vmtest-action: the action
# wraps a deprecated Node runtime, whereas the CLI is a plain `run:` step we can
# pin to an exact release (supply-chain) and is the same engine aya's own runner
# uses. vmtest orchestrates qemu on the host and maps this filesystem into the
# guest, so the VM only re-runs the binaries we already built on the host.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

env:
  CARGO_TERM_COLOR: always
  # Pin vmtest so a new CLI release can't silently change how the VM boots.
  VMTEST_VERSION: "0.18.0"

permissions: {}

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # danobi/vmtest test_assets ship bzImage-v<ver>-default for 5.15..6.18.
        # The 5.10 floor and arm64 need images we build or host ourselves - the
        # `state` (pre-5.14) field path is only exercised there, follow-up.
        kernel: ["5.15", "6.2"]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo install bpf-linker --locked

      # vmtest runs qemu on the host, so qemu must be present; the CLI itself is
      # version-pinned and cached with the rest of the Rust tooling.
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      - run: cargo install vmtest --version "${VMTEST_VERSION}" --locked

      # The runner exposes /dev/kvm but restricts it to the kvm group, which the
      # runner user is not in, so qemu can't init KVM. Open the device so vmtest
      # boots with hardware acceleration instead of falling over.
      - name: Grant access to /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Build the eBPF object and the integration-test binaries on the host, so
      # the VM only runs them under the matrix kernel.
      - run: cargo test -p truetop --no-run

      - name: Fetch the matrix kernel
        run: |
          curl -fL -o bzImage \
            "https://github.com/danobi/vmtest/releases/download/test_assets/bzImage-v${{ matrix.kernel }}-default"

      # vmtest boots that kernel with this same filesystem, running the command in
      # this directory. The VM is root, so xtask runs the prebuilt binaries
      # directly (see xtask::privilege), no sudo needed. The host PATH is injected
      # so the guest shell finds the cargo the runner installed.
      - name: Integration tests under the matrix kernel
        run: vmtest -k bzImage "export PATH='${PATH}' && cargo xtask test"
