name: truetop-ci

on:
  push:

  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Bump together with the toolchain in truetop-ebpf/Cargo.toml.
  BPF_LINKER_VERSION: "0.11.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/ebpf-toolchain

      - run: rustup component add clippy rustfmt --toolchain "${EBPF_TOOLCHAIN}"

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: bpf-linker@${{ env.BPF_LINKER_VERSION }}

      - run: cargo "+${EBPF_TOOLCHAIN}" fmt --all -- --check

      - run: cargo "+${EBPF_TOOLCHAIN}" clippy --workspace --exclude truetop-ebpf --all-targets -- -D warnings

      # Nothing else compiles the bench scripts, and they share bench/lib.sh, so
      # a rename there breaks all of them and only a root-only run would notice.
      - name: bench scripts parse, and lib.sh works
        run: |
          bash -n bench/lib.sh bench/*/run.sh
          source bench/lib.sh
          [ "$(printf '1\n3\n2\n' | WARMUP=0 iqr_stats)" = "3 2.0 1.0 3.0 1.0 3.0" ]
          [ "$(printf '' | WARMUP=0 iqr_stats)" = "0 0 0 0 0 0" ]

  # Advisories, licences and sources. No toolchain or bpf-linker needed: it reads
  # the lockfile, not the code.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # nightly + rust-src builds the eBPF object; stable stays the default for
      # the user-space crates.
      - uses: ./.github/actions/ebpf-toolchain

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: bpf-linker@${{ env.BPF_LINKER_VERSION }}

      - run: cargo test --workspace --exclude truetop-ebpf

      # The BTF parser against real kernel blobs (testdata/); pure, no kernel.
      - run: cargo test -p truetop --features btf-fixtures

  run-integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/ebpf-toolchain

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: bpf-linker@${{ env.BPF_LINKER_VERSION }}

      # ubuntu-latest is a real kernel with BTF and passwordless sudo, so the
      # eBPF integration tests run here (one kernel; the VM matrix is later).
      - run: cargo xtask test

  cross-check:
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - s390x-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/ebpf-toolchain

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: bpf-linker@${{ env.BPF_LINKER_VERSION }}

      # User-space must compile for other arches and endianness (BTF parsing
      # handles endianness at runtime; this catches layout/porting breaks).
      # Check only - no cross linker needed.
      - run: cargo check -p truetop --target ${{ matrix.target }}

  check:
    if: always()
    needs:
      - lint
      - deny
      - build-test
      - run-integration-test
      - cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
