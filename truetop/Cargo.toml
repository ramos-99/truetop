[package]
name = "truetop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

description = "Per-process Linux monitor built on eBPF, including per-process I/O wait"
keywords = ["ebpf", "monitoring", "linux", "top", "observability"]
categories = ["command-line-utilities", "os::linux-apis"]

[dependencies]
truetop-common = { path = "../truetop-common", features = ["user"] }

anyhow = { workspace = true, default-features = true }
aya = { workspace = true }
aya-log = { workspace = true }
env_logger = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "net",
    "signal",
    "time",
] }
ratatui = "0.30.2"
crossterm = "0.29.0"
arc-swap = "1.9.1"

[features]
# Verifies the BTF parser against real kernel blobs in testdata/; off by default
# since the blobs must be fetched (`cargo xtask update-btf-fixtures`).
btf-fixtures = []

[dev-dependencies]
lzma-rs = "0.3"
tar = "0.4"

[build-dependencies]
anyhow = { workspace = true }
aya-build = { workspace = true }
cargo_metadata = { workspace = true }
# TODO(https://github.com/rust-lang/cargo/issues/12375): this should be an artifact dependency, but
# it's not possible to tell cargo to use `-Z build-std` to build it. We cargo-in-cargo in the build
# script to build this, but we want to teach cargo about the dependency so that cache invalidation
# works properly.
#
# Note also that https://github.com/rust-lang/cargo/issues/10593 occurs when `target = ...` is added
# to an artifact dependency; it seems possible to work around that by setting `resolver = "1"` in
# Cargo.toml in the workspace root.
#
# Finally note that *any* usage of `artifact = ...` in *any* Cargo.toml in the workspace breaks
# workflows with stable cargo; stable cargo outright refuses to load manifests that use unstable
# features.
truetop-ebpf = { path = "../truetop-ebpf" }

[[bin]]
name = "truetop"
path = "src/main.rs"
