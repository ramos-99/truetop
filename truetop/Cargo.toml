[package]
name = "truetop"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

description = "Per-process Linux monitor built on eBPF, including per-process I/O wait"
keywords = ["ebpf", "monitoring", "linux", "top", "observability"]
categories = ["command-line-utilities", "os::linux-apis"]

[dependencies]
truetop-common = { path = "../truetop-common", version = "0.1.0", features = ["user"] }

anyhow = { workspace = true, default-features = true }
aya = { workspace = true }
env_logger = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "net",
    "signal",
    "time",
] }
ratatui = "0.30.2"
crossterm = "0.29.0"
arc-swap = "1.9.1"
terminal-colorsaurus = "1.0.3"

[features]
# Verifies the BTF parser against real kernel blobs in testdata/; off by default
# since the blobs must be fetched (`cargo xtask update-btf-fixtures`).
btf-fixtures = []

[dev-dependencies]
lzma-rs = "0.3"
tar = "0.4"

[build-dependencies]
anyhow = { workspace = true }
aya-build = { workspace = true }
cargo_metadata = { workspace = true }
# Not an artifact dependency, on two counts: cargo cannot be told to build one
# with `-Z build-std`, and any `artifact = ...` anywhere in the workspace makes
# stable cargo refuse the manifest outright (rust-lang/cargo#12375). build.rs
# runs the nested cargo; this path entry is what keeps cache invalidation honest.
truetop-ebpf = { path = "../truetop-ebpf", version = "0.1.0" }

[[bin]]
name = "truetop"
path = "src/main.rs"
