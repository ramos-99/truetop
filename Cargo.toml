[workspace]
resolver = "2"
members = [
    "truetop",
    "truetop-common",
    "truetop-ebpf",
    "bench",
    "xtask",
]
default-members = ["truetop", "truetop-common", "bench"]

[workspace.package]
license = "MIT OR Apache-2.0"
edition = "2024"
# let-chains, used in the eBPF hooks, stabilised here.
rust-version = "1.88"
repository = "https://github.com/ramos-99/truetop"

[workspace.dependencies]
# Released aya, not a git branch: loader and map-API behaviour is what every
# published benchmark number was measured against, so it moves when we decide it
# does. Bump deliberately, then re-run the benchmarks.
aya = { version = "0.14.0", default-features = false }
aya-build = { version = "0.2.0", default-features = false }
aya-ebpf = { version = "0.2.1", default-features = false }

anyhow = { version = "1", default-features = false }
cargo_metadata = { version = "0.23.1", default-features = false }
env_logger = { version = "0.11.10", default-features = false }
# libc 1.0 is still a pre-release as of 2026-06; stay on the stable 0.2 line.
libc = { version = "0.2.159", default-features = false }
log = { version = "0.4.33", default-features = false }
tokio = { version = "1.52.3", default-features = false }
which = { version = "8.0.4", default-features = false }

[profile.release.package.truetop-ebpf]
debug = 2
codegen-units = 1
strip = false
