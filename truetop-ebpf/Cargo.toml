[package]
name = "truetop-ebpf"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

# Kernel-side code, matching the licence the object declares to the verifier.
license = "GPL-2.0-only OR MIT"
description = "eBPF programs for truetop"

# Read by truetop/build.rs and CI. Bump together with BPF_LINKER_VERSION.
[package.metadata.ebpf]
toolchain = "nightly-2026-08-25"

[dependencies]
truetop-common = { path = "../truetop-common", version = "0.1.0" }

aya-ebpf = { workspace = true }

[build-dependencies]
which = { workspace = true }

[[bin]]
name = "truetop"
path = "src/main.rs"
