[package]
name = "truetop-ebpf"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

# Kernel-side code, matching the licence the object declares to the verifier.
license = "GPL-2.0 OR MIT"
description = "eBPF programs for truetop"

[dependencies]
truetop-common = { path = "../truetop-common" }

aya-ebpf = { workspace = true }

[build-dependencies]
which = { workspace = true }

[[bin]]
name = "truetop"
path = "src/main.rs"
