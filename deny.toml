# cargo-deny: what a dependency change is allowed to do to this tree.
# Run locally with `cargo deny check`; CI runs the same.

[advisories]
# truetop runs as root and loads programs into the kernel, so a dependency with
# a known advisory is worse here than in an ordinary binary.
yanked = "deny"

[licenses]
# User space is MIT or Apache-2.0; the eBPF crate is GPL-2.0 or MIT, matching
# what the object declares to the verifier. Nothing may drag in anything else.
#
# Only what the tree actually uses, so a new licence arriving is a review rather
# than a silent addition.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    # The Mozilla CA bundle, via ureq in xtask.
    "CDLA-Permissive-2.0",
    "GPL-2.0-only",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[sources]
# Phase 0 moved this workspace off git dependencies so builds are reproducible
# and the crate can be published. This is what stops one creeping back in.
unknown-registry = "deny"
unknown-git = "deny"

[bans]
# Two crates at different versions is usually upstream's business, not ours:
# today ratatui and aya pull different majors of hashbrown. Worth seeing, not
# worth failing a build over.
multiple-versions = "warn"
# A crate pinned to "*" from crates.io is a build nobody can reproduce. The
# workspace's own path dependencies carry no version and are not that.
wildcards = "deny"
allow-wildcard-paths = true
